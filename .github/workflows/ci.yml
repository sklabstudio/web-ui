name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          mypy src || true
          pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --run
          npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: pip install -e .
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          SKLAB_BACKEND_URL=http://127.0.0.1:8787 npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          npx playwright test --project=setup --project=mock
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build ./backend -t sklab-web-api:ci
          docker build ./frontend -t sklab-web-ui:ci
